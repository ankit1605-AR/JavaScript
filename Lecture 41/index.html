<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Hello Dosto</h1>
    <form action="" id="form">

        <div><label for="username">Name: </label>
            <input type="text" id="username"  placeholder="Enter your username">
            <span class="error-msg" style="color: red;"></span>
        </div>
        <div><label for="email">Email: </label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error-msg" style="color: red;"></span>

        </div>

        <div><label for="password">Password: </label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error-msg" style="color: red;"></span>

        </div>
        <p id="password-hint" class="hidden">Must be at least 8 characters</p>
        <div><label for="bio">Bio: </label>
            <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
            <p id="char-count"></p>
            <span class="error-msg" style="color: red;"></span>

        </div>
        <div>
            <label for="country">Select your country :</label>
            <select name="country" id="country">
                <option value="india">india</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
        </div>

        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms and conditions.</label>
        </div>

        <button type="submit" id="btn">Create Account</button>

    </form>
    <!-- <script src="index.js"></script> -->
    <script src="index2.js"></script>
</body>

</html>
